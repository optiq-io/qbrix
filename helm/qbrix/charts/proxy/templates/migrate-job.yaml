{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "proxy.fullname" . }}-migrate
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  annotations:
    # an upgrade migrates before the new pods roll out, and a failed migration
    # fails the upgrade. a first install cannot: the service account, the
    # postgres secret and in-cluster postgres are release resources that do not
    # exist yet at pre-install, so it migrates right after they are created.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, sys, time
              host, port = sys.argv[1], int(sys.argv[2])
              deadline = time.monotonic() + 300
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      break
                  except OSError:
                      if time.monotonic() > deadline:
                          sys.exit(f"postgres at {host}:{port} unreachable")
                      time.sleep(2)
            - {{ include "proxy.postgresHost" . | quote }}
            - {{ .Values.global.postgres.port | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "qbrixstore.migrate", "upgrade", "head"]
          env:
            # qbrixstore reads POSTGRES_* (not PROXY_POSTGRES_*)
            - name: POSTGRES_HOST
              value: {{ include "proxy.postgresHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.global.postgres.port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.global.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.postgresSecretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.postgresSecretName" . }}
                  key: password
            - name: LOG_FORMAT
              value: {{ .Values.global.logging.format | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
