apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxy.fullname" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "proxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxy.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.config.grpc.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.config.http.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "proxy.fullname" . }}
          env:
            # postgres credentials from secret
            - name: PROXY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.postgresSecretName" . }}
                  key: username
            - name: PROXY_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.postgresSecretName" . }}
                  key: password
            # redis password from secret (if configured)
            {{- if or .Values.global.redis.password .Values.global.redis.existingSecret }}
            - name: PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.redisSecretName" . }}
                  key: password
            {{- end }}
            # jwt secret
            - name: PROXY_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.jwtSecretName" . }}
                  key: {{ .Values.config.jwt.existingSecretKey }}
            # selection token secret
            - name: PROXY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.tokenSecretName" . }}
                  key: {{ .Values.config.token.existingSecretKey }}
            # email provider credentials
            {{- if .Values.config.resend.existingSecret }}
            - name: PROXY_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.resend.existingSecret }}
                  key: {{ .Values.config.resend.existingSecretKey }}
            {{- end }}
            {{- if .Values.config.smtp.existingSecret }}
            - name: PROXY_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.smtp.existingSecret }}
                  key: {{ .Values.config.smtp.existingSecretKey }}
            {{- end }}
            # stripe secrets (if ee enabled and configured)
            {{- if and (.Values.global.ee.enabled) .Values.config.stripe.existingSecret }}
            - name: PROXY_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.stripe.existingSecret }}
                  key: {{ .Values.config.stripe.existingSecretKey }}
            - name: PROXY_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.stripe.existingSecret }}
                  key: {{ .Values.config.stripe.existingWebhookSecretKey }}
            {{- end }}
            {{- if and (.Values.global.analytics.enabled) (or .Values.global.clickhouse.password .Values.global.clickhouse.existingSecret) }}
            - name: PROXY_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.clickhouseSecretName" . }}
                  key: password
            {{- end }}
            {{- if .Values.global.sentry.enabled }}
            # optional: observability config must never block startup
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxy.sentrySecretName" . }}
                  key: proxy-dsn
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.preStopDelaySeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.preStopDelaySeconds | quote }}]
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}