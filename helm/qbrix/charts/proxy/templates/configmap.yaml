apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proxy.fullname" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
data:
  # runtime environment
  PROXY_RUNENV: {{ .Values.config.runenv | quote }}
  PROXY_SHUTDOWN_GRACE_SEC: {{ .Values.config.shutdownGraceSec | quote }}

  # grpc settings
  PROXY_GRPC_HOST: {{ .Values.config.grpc.host | quote }}
  PROXY_GRPC_PORT: {{ .Values.config.grpc.port | quote }}

  # http settings
  PROXY_HTTP_HOST: {{ .Values.config.http.host | quote }}
  PROXY_HTTP_PORT: {{ .Values.config.http.port | quote }}

  # postgres connection
  PROXY_POSTGRES_HOST: {{ include "proxy.postgresHost" . | quote }}
  PROXY_POSTGRES_PORT: {{ .Values.global.postgres.port | quote }}
  PROXY_POSTGRES_DATABASE: {{ .Values.global.postgres.database | quote }}

  # redis connection
  PROXY_REDIS_HOST: {{ include "proxy.redisHost" . | quote }}
  PROXY_REDIS_PORT: {{ .Values.global.redis.port | quote }}
  PROXY_REDIS_DB: {{ .Values.global.redis.db | quote }}

  # motor service connection
  PROXY_MOTOR_HOST: {{ include "proxy.motorHost" . | quote }}
  PROXY_MOTOR_PORT: {{ .Values.config.motor.port | quote }}

  # cortex service connection
  PROXY_CORTEX_HOST: {{ include "proxy.cortexHost" . | quote }}
  PROXY_CORTEX_PORT: {{ .Values.config.cortex.port | quote }}

  # enterprise edition
  PROXY_EE_ENABLED: {{ .Values.global.ee.enabled | default false | quote }}
  PROXY_ANALYTICS_ENABLED: {{ .Values.global.analytics.enabled | default false | quote }}

  # stripe billing (ee) — 5-tier usage model: base price per tier + a single
  # selections meter + a metered price per self-serve tier (no enterprise metered)
  {{- if .Values.global.ee.enabled }}
  PROXY_STRIPE_PRICE_ID_STARTER: {{ .Values.config.stripe.priceIdStarter | quote }}
  PROXY_STRIPE_PRICE_ID_GROWTH: {{ .Values.config.stripe.priceIdGrowth | quote }}
  PROXY_STRIPE_PRICE_ID_SCALE: {{ .Values.config.stripe.priceIdScale | quote }}
  PROXY_STRIPE_PRICE_ID_ENTERPRISE: {{ .Values.config.stripe.priceIdEnterprise | quote }}
  PROXY_STRIPE_METER_ID: {{ .Values.config.stripe.meterId | quote }}
  PROXY_STRIPE_METERED_PRICE_ID_STARTER: {{ .Values.config.stripe.meteredPriceIdStarter | quote }}
  PROXY_STRIPE_METERED_PRICE_ID_GROWTH: {{ .Values.config.stripe.meteredPriceIdGrowth | quote }}
  PROXY_STRIPE_METERED_PRICE_ID_SCALE: {{ .Values.config.stripe.meteredPriceIdScale | quote }}
  {{- end }}

  # console url (for verify / reset / invite links)
  PROXY_CONSOLE_URL: {{ include "proxy.consoleUrl" . | quote }}

  # self-host runtime
  PROXY_SIGNUP_MODE: {{ .Values.config.signupMode | quote }}
  PROXY_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  PROXY_TRUSTED_PROXY_HOPS: {{ .Values.config.trustedProxyHops | quote }}
  PROXY_TRUST_CLOUDFRONT_HEADER: {{ .Values.config.trustCloudfrontHeader | quote }}

  # transactional email
  PROXY_EMAIL_PROVIDER: {{ .Values.config.emailProvider | quote }}
  PROXY_EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
  {{- if .Values.config.smtp.host }}
  PROXY_SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  PROXY_SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  PROXY_SMTP_USERNAME: {{ .Values.config.smtp.username | quote }}
  PROXY_SMTP_STARTTLS: {{ .Values.config.smtp.startTls | quote }}
  {{- end }}

  # feature gate cache settings
  PROXY_GATE_CACHE_MAXSIZE: {{ .Values.config.gateCache.maxSize | quote }}
  PROXY_GATE_CACHE_TTL: {{ .Values.config.gateCache.ttl | quote }}
  PROXY_GATE_REDIS_TTL: {{ .Values.config.gateCache.redisTtl | quote }}

  # jwt settings
  PROXY_JWT_ALGORITHM: {{ .Values.config.jwt.algorithm | quote }}
  PROXY_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.jwt.accessTokenExpireMinutes | quote }}
  PROXY_JWT_REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.jwt.refreshTokenExpireDays | quote }}

  # clickhouse connection (analytics)
  {{- if .Values.global.analytics.enabled }}
  PROXY_CLICKHOUSE_HOST: {{ include "proxy.clickhouseHost" . | quote }}
  PROXY_CLICKHOUSE_PORT: {{ .Values.global.clickhouse.port | quote }}
  PROXY_CLICKHOUSE_USER: {{ .Values.global.clickhouse.user | quote }}
  PROXY_CLICKHOUSE_DATABASE: {{ .Values.global.clickhouse.database | quote }}
  {{- end }}

  # logging
  PROXY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.global.logging.format | quote }}

  {{- if .Values.global.sentry.enabled }}
  SENTRY_ENVIRONMENT: {{ .Values.global.sentry.environment | quote }}
  SENTRY_RELEASE: {{ include "proxy.imageTag" . | quote }}
  {{- end }}