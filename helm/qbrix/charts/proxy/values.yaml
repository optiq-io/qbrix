# proxy service values
# gateway/control plane - horizontally scalable

replicaCount: 2

image:
  repository: qbrix/proxy
  pullPolicy: IfNotPresent
  tag: ""  # defaults to chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# service configuration
service:
  type: ClusterIP
  grpcPort: 50050
  httpPort: 8080
  annotations: {}

# ingress for the http api. the console calls /api on its own origin, so this
# serves /api on the console's host
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: qbrix.local
      paths:
        - path: /api
          pathType: Prefix
          port: 8080
  tls: []
    # - secretName: qbrix-tls
    #   hosts:
    #     - qbrix.local

# horizontal pod autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# shutdown. the prestop delay covers load balancer deregistration — the pod
# keeps receiving traffic for a moment after SIGTERM — and the grace period has
# to outlast it plus both transports draining, or the kubelet SIGKILLs mid-drain
# and queued selection/feedback events are lost.
preStopDelaySeconds: 5
terminationGracePeriodSeconds: 60

# node selection
nodeSelector: {}
tolerations: []
affinity: {}

# pod annotations and labels
podAnnotations: {}
podLabels: {}

# security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# database migrations (alembic) - run as a helm pre-install/pre-upgrade hook Job
# before the proxy rolls out. the Job uses the proxy image and tag.
migrations:
  enabled: true
  backoffLimit: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# environment-specific config
config:
  runenv: "prod"
  logLevel: "INFO"

  # per-transport drain budget on shutdown, in seconds. http and grpc drain in
  # sequence, so terminationGracePeriodSeconds must exceed
  # preStopDelaySeconds + 2 * shutdownGraceSec.
  shutdownGraceSec: 20

  # grpc settings
  grpc:
    host: "0.0.0.0"
    port: 50050

  # http settings
  http:
    host: "0.0.0.0"
    port: 8080

  # motor service connection
  motor:
    host: ""  # auto-discovered if empty
    port: 50051

  # cortex service connection
  cortex:
    host: ""  # auto-discovered if empty
    port: 50052

  # feature gate cache
  gateCache:
    maxSize: 1000
    ttl: 30.0
    redisTtl: 300

  # who may create a workspace through public registration:
  # open | first-user | invite-only
  signupMode: "first-user"

  # browser origins granted the credentialed console cors policy, comma
  # separated. localhost is always allowed.
  corsOrigins: ""

  # reverse proxies in front of the proxy that append to x-forwarded-for; the
  # pre-auth rate limiter keys on the client address this many hops from the
  # right. 1 for an ingress controller, 2 for a cdn in front of a load balancer.
  trustedProxyHops: 1
  # key the pre-auth rate limiter on CloudFront-Viewer-Address. only safe when
  # cloudfront is the sole way in and its origin request policy adds the header;
  # otherwise any client can set it.
  trustCloudfrontHeader: false

  # public url of the console, used to build verify/reset/invite links.
  # defaults to the first ingress host, which is the console's host
  consoleUrl: ""
  # deprecated name for consoleUrl, still honoured
  cloudUrl: ""

  # transactional email: auto | smtp | resend | none.
  # auto picks resend when an api key is set, else smtp when a host is set,
  # else none — which auto-verifies new accounts and logs the links.
  emailProvider: "auto"
  emailFrom: "qbrix <noreply@localhost>"

  resend:
    existingSecret: ""
    existingSecretKey: "resend-api-key"

  smtp:
    host: ""
    port: 587
    username: ""
    startTls: true
    existingSecret: ""
    existingSecretKey: "smtp-password"

  # stripe billing (ee)
  stripe:
    priceIdStarter: ""
    priceIdGrowth: ""
    priceIdScale: ""
    priceIdEnterprise: ""
    meterId: ""
    meteredPriceIdStarter: ""
    meteredPriceIdGrowth: ""
    meteredPriceIdScale: ""
    existingSecret: ""
    existingSecretKey: "stripe-secret-key"
    existingWebhookSecretKey: "stripe-webhook-secret"

  # jwt settings
  jwt:
    algorithm: "HS256"
    accessTokenExpireMinutes: 30
    refreshTokenExpireDays: 7
    # with neither secretKey nor existingSecret, a key is generated on install
    # and kept across upgrades; render-only tools (helm template, argocd) need
    # existingSecret instead
    secretKey: ""
    existingSecret: ""
    existingSecretKey: "jwt-secret"

  # selection token secret; generated like the jwt key when unset
  token:
    secretKey: ""
    existingSecret: ""
    existingSecretKey: "token-secret"

# extra environment variables
extraEnv: []
  # - name: EXTRA_VAR
  #   value: "value"

# extra volumes and mounts
extraVolumes: []
extraVolumeMounts: []