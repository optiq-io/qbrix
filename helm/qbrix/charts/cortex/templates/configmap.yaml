apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cortex.fullname" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
data:
  # grpc settings
  CORTEX_GRPC_HOST: {{ .Values.config.grpc.host | quote }}
  CORTEX_GRPC_PORT: {{ .Values.config.grpc.port | quote }}
  CORTEX_SHUTDOWN_GRACE_SEC: {{ .Values.config.shutdownGraceSec | quote }}

  # redis connection
  CORTEX_REDIS_HOST: {{ include "cortex.redisHost" . | quote }}
  CORTEX_REDIS_PORT: {{ .Values.global.redis.port | quote }}
  CORTEX_REDIS_DB: {{ .Values.global.redis.db | quote }}

  # this replica's consumer identity; the stream and group it joins are fixed
  # topology, declared in qbrixstore.stream.topology
  CORTEX_CONSUMER_NAME: {{ .Values.config.stream.consumerName | quote }}

  # batch processing settings
  CORTEX_BATCH_SIZE: {{ .Values.config.batch.size | quote }}
  CORTEX_BATCH_TIMEOUT_MS: {{ .Values.config.batch.timeoutMs | quote }}
  CORTEX_NUM_WORKERS: {{ .Values.config.batch.numWorkers | quote }}

  # the ledger the sealer reads
  CORTEX_CLICKHOUSE_HOST: {{ include "cortex.clickhouseHost" . | quote }}
  CORTEX_CLICKHOUSE_PORT: {{ .Values.global.clickhouse.port | quote }}
  CORTEX_CLICKHOUSE_USER: {{ .Values.global.clickhouse.user | quote }}
  CORTEX_CLICKHOUSE_DATABASE: {{ .Values.global.clickhouse.database | quote }}
  CORTEX_SEAL_INTERVAL_SEC: {{ .Values.config.seal.intervalSec | quote }}

  # logging
  CORTEX_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.global.logging.format | quote }}

  {{- if .Values.global.sentry.enabled }}
  SENTRY_ENVIRONMENT: {{ .Values.global.sentry.environment | quote }}
  SENTRY_RELEASE: {{ include "cortex.imageTag" . | quote }}
  {{- end }}
