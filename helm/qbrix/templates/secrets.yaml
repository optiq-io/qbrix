{{- if not .Values.global.postgres.existingSecret }}
{{- $name := printf "%s-postgres" .Release.Name }}
{{- $password := .Values.global.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "qbrix.labels" . | nindent 4 }}
  {{- if not $password }}
  {{- if not .Values.infrastructure.postgres.enabled }}
  {{- fail "global.postgres.existingSecret or global.postgres.password is required when infrastructure.postgres is disabled" }}
  {{- end }}
  {{- $password = include "qbrix.persistentSecretValue" (dict "ctx" . "name" $name "key" "password") }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  username: {{ .Values.global.postgres.username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
---
{{- if and (not .Values.global.redis.existingSecret) .Values.global.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "qbrix.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.global.redis.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.global.analytics.enabled (not .Values.global.clickhouse.existingSecret) .Values.global.clickhouse.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels:
    {{- include "qbrix.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.global.clickhouse.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.global.sentry.enabled (not .Values.global.sentry.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sentry
  labels:
    {{- include "qbrix.labels" . | nindent 4 }}
type: Opaque
data:
  proxy-dsn: {{ .Values.global.sentry.dsn.proxy | b64enc | quote }}
  motor-dsn: {{ .Values.global.sentry.dsn.motor | b64enc | quote }}
  cortex-dsn: {{ .Values.global.sentry.dsn.cortex | b64enc | quote }}
  trace-dsn: {{ .Values.global.sentry.dsn.trace | b64enc | quote }}
  meter-dsn: {{ .Values.global.sentry.dsn.meter | b64enc | quote }}
{{- end }}