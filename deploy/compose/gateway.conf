server {
    listen 80;

    # resolve through docker's dns per request: a static upstream pins the ip a
    # container had when nginx started, and 502s once compose recreates it
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $proxy_upstream http://proxy:8080;
    set $console_upstream http://console:3000;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # the proxy counts one trusted hop, so the entry this gateway appends is the
    # client address its login rate limit keys on
    proxy_set_header CloudFront-Viewer-Address "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass $proxy_upstream;
    }

    location / {
        proxy_pass $console_upstream;
    }
}
