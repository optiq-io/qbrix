[project]
name = "qbrixstore"
version = "0.1.0"  # x-release-please-version
description = "Storage layer for qbrix - Postgres models and Redis clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "greenlet>=3.3.0",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
    "black>=24.0.0",
    "pytest-mock>=3.14.1",
    "fakeredis>=2.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=qbrixstore",
    "--cov-report=term-missing",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.pdm.build]
# ensure alembic assets (env.py, versions/, script.py.mako) ship in the wheel,
# since the proxy image installs qbrixstore non-editable and copies only .venv
includes = ["qbrixstore/"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
