# alembic config for qbrixstore (dev / source-checkout use).
# the database url is supplied by env.py from PostgresSettings (or ALEMBIC_URL),
# so it is intentionally not set here. in containers, migrations run via
# `python -m qbrixstore.migrate`, which builds the config programmatically.

[alembic]
script_location = qbrixstore/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
