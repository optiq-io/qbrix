# qbrix self-host quickstart
#
#   bin/selfhost-init        # writes .env with generated secrets
#   docker compose up -d     # console on http://localhost:8000
#
# contributors building from source use docker-compose.dev.yml (make docker).

name: qbrix

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-qbrix}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, run bin/selfhost-init}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-qbrix}

services:
  gateway:
    image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${QBRIX_PORT:-8000}:80"
    volumes:
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy
      - console
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qbrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, run bin/selfhost-init}
      POSTGRES_DB: ${POSTGRES_DATABASE:-qbrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/proxy:${QBRIX_VERSION:-latest}
    command: ["python", "-m", "qbrixstore.migrate", "upgrade", "head"]
    environment:
      <<: *postgres-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/proxy:${QBRIX_VERSION:-latest}
    environment:
      PROXY_RUNENV: prod
      PROXY_POSTGRES_HOST: postgres
      PROXY_POSTGRES_USER: ${POSTGRES_USER:-qbrix}
      PROXY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, run bin/selfhost-init}
      PROXY_POSTGRES_DATABASE: ${POSTGRES_DATABASE:-qbrix}
      PROXY_REDIS_HOST: redis
      PROXY_MOTOR_HOST: motor
      PROXY_CORTEX_HOST: cortex
      PROXY_JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set, run bin/selfhost-init}
      PROXY_TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is not set, run bin/selfhost-init}
      PROXY_SIGNUP_MODE: ${SIGNUP_MODE:-first-user}
      PROXY_CONSOLE_URL: ${CONSOLE_URL:-http://localhost:${QBRIX_PORT:-8000}}
      PROXY_CORS_ORIGINS: ${CORS_ORIGINS:-}
      PROXY_TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      PROXY_EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      PROXY_EMAIL_FROM: ${EMAIL_FROM:-qbrix <noreply@localhost>}
      PROXY_RESEND_API_KEY: ${RESEND_API_KEY:-}
      PROXY_SMTP_HOST: ${SMTP_HOST:-}
      PROXY_SMTP_PORT: ${SMTP_PORT:-587}
      PROXY_SMTP_USERNAME: ${SMTP_USERNAME:-}
      PROXY_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PROXY_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PROXY_ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      PROXY_CLICKHOUSE_HOST: clickhouse
      PROXY_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  motor:
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/motor:${QBRIX_VERSION:-latest}
    environment:
      MOTOR_REDIS_HOST: redis
      MOTOR_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cortex:
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/cortex:${QBRIX_VERSION:-latest}
    environment:
      CORTEX_REDIS_HOST: redis
      CORTEX_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  console:
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/console:${QBRIX_VERSION:-latest}
    depends_on:
      - proxy
    restart: unless-stopped

  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24.1@sha256:44caeed7c81f7934c28a8ffa3a422a4ca96cf3bccc486d21311e5133ce88d49f
    environment:
      CLICKHOUSE_DB: qbrix
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trace:
    profiles: ["analytics"]
    image: ${QBRIX_REGISTRY:-ghcr.io/optiq-io}/qbrix/trace:${QBRIX_VERSION:-latest}
    environment:
      TRACE_REDIS_HOST: redis
      TRACE_CLICKHOUSE_HOST: clickhouse
      TRACE_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
